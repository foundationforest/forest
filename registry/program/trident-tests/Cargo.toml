[workspace]

[package]
name = "forest-registry-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Trident fuzz tests for the Forest registry program: random flows against the built program and real Semaphore proofs, invariants checked after every step."

[[bin]]
name = "fuzz_registry"
path = "fuzz_registry/test_fuzz.rs"

[dependencies]
borsh = "1.5.3"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-poseidon = "2.2"

[dependencies.trident-fuzz]
version = "0.12.0"

[workspace]

[package]
name = "forest-registry-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM tests for the Forest registry program, against real Semaphore proofs."

[dependencies]
bincode = "1.3"
litesvm = "0.16.0"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-compute-budget-interface = "3.0.0"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-poseidon = { version = "3.1.14", features = ["agave-unstable-api"] }
solana-rent = "4.3.0"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.5", features = ["serde"] }
groth16-solana = "0.2.0"

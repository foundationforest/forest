[package]
name = "forest-registry"
version = "0.1.0"
edition = "2021"
description = "The Forest registry: one row per market stamp, on Solana. Sealed per version on mainnet."
license = "Apache-2.0"
publish = false
exclude = ["tests-litesvm"]

[lib]
crate-type = ["cdylib", "lib"]
name = "forest_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Features Anchor's macros test for; declared so the build has no warnings. None is turned on.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "1.2.0"
groth16-solana = "0.2.0"
solana-keccak-hasher = "3.1.0"

# Arithmetic that overflows panics instead of wrapping. The program does little arithmetic (a
# row's size, and the refund's excess, which saturates); this makes any overflow abort, never wrap.
[profile.release]
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

[package]
name = "registry-feasibility-scratch"
version = "0.0.0"
edition = "2021"
publish = false
description = "Host-side scratch tests for the registry feasibility check: Poseidon, tree roots, Groth16 verification, and compute units under LiteSVM."

[dependencies]

[dev-dependencies]
groth16-solana = "0.2.0"
solana-poseidon = "5.0.0"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litesvm = "0.16.0"
solana-address = "~2.6.1"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-instruction = "~3.4.0"
solana-account = "4.3.0"
solana-compute-budget-interface = "3.0.0"
solana-system-interface = "3.2.0"

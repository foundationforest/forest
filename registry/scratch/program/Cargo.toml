[package]
name = "registry-cu-scratch"
version = "0.0.0"
edition = "2021"
publish = false
description = "Scratch Solana program used only to measure compute units for the registry feasibility check. Not the registry."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.3.0"
groth16-solana = "0.2.0"
solana-poseidon = "2.2.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

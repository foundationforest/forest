<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No third-party code, no inline script, no HTML from anyone: text only (Trusted Types). The
     loopback sources in connect-src are for the local test; a real page lists https: alone. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: http://127.0.0.1:* http://localhost:*; img-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'">
<title>Approve</title>
<link rel="stylesheet" href="approve.css">
</head>
<body>
<main>
  <h1 id="title">Forest</h1>
  <section id="what" aria-live="polite"></section>
  <p id="status" role="status"></p>
  <div id="actions">
    <button id="create" hidden>Create a passkey</button>
    <button id="setup" hidden>Set up my profile</button>
    <button id="approve" hidden>Approve</button>
    <button id="decline" hidden>Decline</button>
  </div>
</main>
<script type="module" src="approve.js"></script>
</body>
</html>
